<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ray Color</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div class="container">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="light-markers"></div>
    <div id="sample-markers"></div>
  </div>
  <div id="resolution"></div>
  <div id="fps"></div>
  <div class="samples-panel">
    <h3>Colors</h3>
    <div id="samples-list"></div>
  </div>

  <div class="controls">
    <div class="control-panel">
      <h3>Camera & Sphere</h3>
      <label>Camera Z:</label>
      <input type="range" id="cameraZ" min="-10" max="-2" value="-4.5" step="0.1"><br>
      <label>FOV:</label>
      <input type="range" id="cameraFOV" min="10" max="120" value="30" step="1"><br>
      <label>Sphere Color:</label>
      <input type="color" id="sphereColor" value="#ffffff"><br>
      <label>Sphere Size:</label>
      <input type="range" id="sphereRadius" min="0.1" max="1.5" value="0.8" step="0.1"><br>
      <label>Wall Color:</label>
      <input type="color" id="wallColor" value="#999999"><br>
      <label>Indirect Light:</label>
      <input type="range" id="indirectIntensity" min="0" max="1" value="0.3" step="0.05"><br>
      <label>Light Size:</label>
      <input type="range" id="lightSize" min="0" max="0.5" value="0.15" step="0.05">
      <br>
      <label>Area Samples:</label>
      <input type="range" id="areaQuality" min="1" max="48" value="6" step="1">
    </div>

    <!-- Removed global directional mode; all lights now use yaw/pitch/distance -->

    <div class="light-control">
      <h3>Light 1</h3>
      <label>Type:</label>
      <select id="light1Type">
        <option value="point">Point Light</option>
        <option value="area">Area Light</option>
        <option value="directional" selected>Directional</option>
        <option value="spot">Spot Light</option>
      </select><br>
      <div class="spherical-group" data-light="1">
        <label>Yaw°:</label> <input type="range" id="light1Yaw" min="-180" max="180" value="45" step="1"><br>
        <label>Pitch°:</label> <input type="range" id="light1Pitch" min="-89" max="89" value="-20" step="1"><br>
        <label>Distance:</label> <input type="range" id="light1Dist" min="0.2" max="4" value="2" step="0.1"><br>
    <label>Distance:</label> <input type="range" id="light1Dist" min="0.1" max="5" value="2" step="0.05" data-dynamic-dist><br>
      </div>
      <label>Color:</label> <input type="color" id="light1Color" value="#ff0000"><br>
      <label>Intensity:</label> <input type="range" id="light1I" min="0" max="1.25" value="0.6" step="0.1"><br>
      <label class="spot-angle-label" style="display:none">Angle:</label>
      <input type="range" id="light1Angle" min="10" max="60" value="30" step="5" style="display:none">
    </div>

    <div class="light-control">
      <h3>Light 2</h3>
      <label>Type:</label>
      <select id="light2Type">
        <option value="point">Point Light</option>
        <option value="area">Area Light</option>
        <option value="directional" selected>Directional</option>
        <option value="spot">Spot Light</option>
      </select><br>
      <div class="spherical-group" data-light="2">
        <label>Yaw°:</label> <input type="range" id="light2Yaw" min="-180" max="180" value="-135" step="1"><br>
        <label>Pitch°:</label> <input type="range" id="light2Pitch" min="-89" max="89" value="-20" step="1"><br>
        <label>Distance:</label> <input type="range" id="light2Dist" min="0.2" max="4" value="2" step="0.1"><br>
    <label>Distance:</label> <input type="range" id="light2Dist" min="0.1" max="5" value="2" step="0.05" data-dynamic-dist><br>
      </div>
      <label>Color:</label> <input type="color" id="light2Color" value="#00ff00"><br>
      <label>Intensity:</label> <input type="range" id="light2I" min="0" max="1.25" value="0.6" step="0.1"><br>
      <label class="spot-angle-label" style="display:none">Angle:</label>
      <input type="range" id="light2Angle" min="10" max="60" value="30" step="5" style="display:none">
    </div>

    <div class="light-control">
      <h3>Light 3</h3>
      <label>Type:</label>
      <select id="light3Type">
        <option value="point">Point Light</option>
        <option value="area">Area Light</option>
        <option value="directional" selected>Directional</option>
        <option value="spot">Spot Light</option>
      </select><br>
      <div class="spherical-group" data-light="3">
        <label>Yaw°:</label> <input type="range" id="light3Yaw" min="-180" max="180" value="0" step="1"><br>
        <label>Pitch°:</label> <input type="range" id="light3Pitch" min="-89" max="89" value="-30" step="1"><br>
        <label>Distance:</label> <input type="range" id="light3Dist" min="0.2" max="4" value="2" step="0.1"><br>
    <label>Distance:</label> <input type="range" id="light3Dist" min="0.1" max="5" value="2" step="0.05" data-dynamic-dist><br>
      </div>
      <label>Color:</label> <input type="color" id="light3Color" value="#0000ff"><br>
      <label>Intensity:</label> <input type="range" id="light3I" min="0" max="1.25" value="0.6" step="0.1"><br>
      <label class="spot-angle-label" style="display:none">Angle:</label>
      <input type="range" id="light3Angle" min="10" max="60" value="30" step="5" style="display:none">
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
